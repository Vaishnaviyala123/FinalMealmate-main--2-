<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Menu</title>
</head>
<body>
    <h1>Manage {{ restaurant.name }} Menu</h1>
    <!-- show current menu -->
    <table border="1">
        <thead>
            <tr>
                <th>Item name</th>
                <th>Picture</th>
                <th>Description</th>
                <th>Price</th>
                <th>Is veg?</th>
                <th>Operation</th>
            </tr>
        </thead>
        <tbody>
            {%  for item in itemList %}
                <tr>
                    <td>{{ item.name }}</td>
                    <td>
                        <img src="{{ item.picture }}" alt="{{ item.name }}" width="140" height="90">
                    </td>
                    <td>{{ item.description }}</td>
                    <td>₹{{ item.price|floatformat:2 }}</td>
                    <td>{% if item.vegeterian %}Yes{% else %}No{% endif %}</td>
                    <td>
                        <a href="{% url 'delete_menu_item' item.id %}"
                           onclick="return confirm('Delete {{ item.name|escapejs }}?');">
                            Delete Item
                        </a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>


    <!-- add food item (form) -->
    <h2>Add Menu Item</h2>
    <form action="{% url 'update_menu' restaurant.id %}" method="post">
        {% csrf_token %}
        <label for="name">Item Name:</label>
        <input type="text" id="name" name="name" maxlength="20" required><br><br>

        <label for="description">Description:</label>
        <textarea id="description" name="description" required></textarea><br><br>

        <label for="price">Price:</label>
        <input type="number" id="price" name="price" min="0" step="0.01" required><br><br>

        <label for="vegeterian">Vegetarian:</label>
        <input type="checkbox" id="vegeterian" name="vegeterian"><br><br>

        <label for="picture">Image URL:</label>
        <input type="url" id="picture" name="picture"><br><br>

        <button type="submit">Add Item</button>
    </form>
</body>
</html>
